name: Probe

# Run by hand. Fetches the given URLs from a runner and prints status and platform hints, for adding a new store.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs to fetch (space separated)'
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          URLS: ${{ inputs.urls }}
        run: python -m tools.probe $URLS
