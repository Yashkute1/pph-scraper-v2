name: Probe

# Run by hand. Fetches the given URLs from a runner and prints status and platform hints, for adding a new store.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs to fetch (space separated)'
        required: true
      text:
        description: 'Also print headings, meta tags and page text'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          URLS: ${{ inputs.urls }}
          TEXT_FLAG: ${{ inputs.text }}
        run: |
          if [ "$TEXT_FLAG" = "true" ]; then export TEXT=1; fi
          python -m tools.probe $URLS
