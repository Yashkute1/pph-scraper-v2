name: Load redirects

# Run by hand. Loads old -> new product addresses from redirects.tsv on the `audit` branch into group_redirects.
on:
  workflow_dispatch:

permissions:
  contents: write                    # pushes the request to the `server-jobs` branch; this workflow receives no database secret

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load on the Hostinger server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh tools/request_server_job.sh redirects
