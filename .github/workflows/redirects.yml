name: Load redirects

# Run by hand. Loads old -> new product addresses from redirects.tsv on the `audit` branch into group_redirects.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pymysql==1.1.2 pymongo==4.10.1
      - run: git fetch --depth=1 origin audit && git show origin/audit:redirects.tsv > /tmp/redirects.tsv && wc -l /tmp/redirects.tsv
      - name: Load
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
        run: python -m tools.load_redirects /tmp/redirects.tsv
