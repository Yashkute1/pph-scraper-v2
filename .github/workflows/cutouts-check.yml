name: Cutouts check

# Cuts a study set of photos (by title in tools/check_match.txt, else the keys in tools/check_keys.txt) with the code on this branch and keeps the results as a download, without publishing.
# Used to look at a change to the method before a full run. Starts only from a branch named cutouts-check/*.
on:
  push:
    branches: ['cutouts-check/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cutouts.txt
      - run: pip install -r requirements.txt -r requirements-cutouts.txt
      - name: Look up the photos
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}          # this step only reads image addresses; it downloads nothing
        run: |
          if [ -s tools/check_match.txt ]; then python -m tools.cutouts list todo.txt --match tools/check_match.txt
          else python -m tools.cutouts list todo.txt --keys tools/check_keys.txt; fi
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-birefnet-general-lite
      - name: Remove backgrounds
        env:
          CUTOUT_DEBUG: '1'                              # also keep each photo as the model saw it, and the model's answer
        run: python -m tools.cutouts make todo.txt out   # no secrets in this step
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check
          path: out/
          retention-days: 3
