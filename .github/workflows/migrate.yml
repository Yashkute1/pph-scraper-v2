name: Move to MySQL

# Run by hand (Actions > Move to MySQL > Run workflow). Copies offers with their price history, past runs,
# benchmark scores and old-address redirects from MongoDB into the Hostinger MySQL database, then rebuilds the
# products there. Safe to run more than once. Needs the MONGO_URI and MYSQL_URL secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape-live                # never at the same time as a scrape run that writes
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Copy MongoDB to MySQL
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
        run: python -m tools.mongo_to_mysql
