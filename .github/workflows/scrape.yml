name: Scrape

on:
  schedule:
    - cron: '17 */6 * * *'          # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and report, but write nothing to the database'
        type: boolean
        default: true
  push:
    branches: ['dryrun/**', 'live/**']   # dryrun/* = no-write test; live/* = an immediate real run

permissions:
  contents: read

concurrency:
  # every writing run shares one queue, so two can never update the database at once
  group: scrape-${{ (startsWith(github.ref, 'refs/heads/dryrun/') || inputs.dry_run == true) && github.ref || 'live' }}
  cancel-in-progress: false          # never kill a run that is half-way through writing

env:
  DRY_RUN: ${{ (startsWith(github.ref, 'refs/heads/dryrun/') || inputs.dry_run == true) && '--dry-run' || '' }}
  QUICK: ${{ startsWith(github.ref, 'refs/heads/dryrun/') && '--max-pages 2' || '' }}   # branch tests only sample two pages per category

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.store == 'amazon' && 200 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        store: [elitehubs, vishalperipherals, pcstudio, primeabgb, vedantcomputers, mdcomputers, theitdepot, flipkart, amazon]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - if: matrix.store == 'amazon'
        run: scrapling install
      - name: Scrape ${{ matrix.store }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          echo "| store | status | fetched | written | previous | seconds | note |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          set +e
          python -m pph.run scrape ${{ matrix.store }} $DRY_RUN $QUICK --time-budget ${{ matrix.store == 'amazon' && 170 || 45 }}
          code=$?
          # 3 = the store refused this machine. Old prices stay in place and the store is tried again from another
          # machine below, so this is a warning, not a failed run.
          if [ "$code" -eq 3 ]; then echo "::warning::${{ matrix.store }} refused this machine; it will be tried again from another one"; exit 0; fi
          exit $code
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-${{ matrix.store }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  blocked:
    needs: scrape
    if: ${{ always() && !startsWith(github.ref, 'refs/heads/dryrun/') && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stores: ${{ steps.list.outputs.stores }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: out-*
      - id: list
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          names = []
          for f in pathlib.Path("artifacts").rglob("*.json"):
              try:
                  d = json.loads(f.read_text())
              except ValueError:
                  continue
              if d.get("status") == "blocked" and re.fullmatch(r"[a-z0-9]+", str(d.get("store", ""))):
                  names.append(d["store"])
          print("stores=" + json.dumps(sorted(set(names))))
          PY

  retry:
    # A store that refused the first machine is tried once more, ten minutes later, from a different machine.
    needs: blocked
    if: ${{ always() && needs.blocked.result == 'success' && needs.blocked.outputs.stores != '[]' && needs.blocked.outputs.stores != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.store == 'amazon' && 200 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.blocked.outputs.stores) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - if: matrix.store == 'amazon'
        run: scrapling install
      - run: sleep 600
      - name: Scrape ${{ matrix.store }} again
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          echo "| store | status | fetched | written | previous | seconds | note |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          set +e
          python -m pph.run scrape ${{ matrix.store }} --time-budget ${{ matrix.store == 'amazon' && 170 || 45 }}
          code=$?
          if [ "$code" -eq 3 ]; then echo "::warning::${{ matrix.store }} refused the second machine too; its last good prices stay in place"; exit 0; fi
          exit $code
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-retry-${{ matrix.store }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  rollup:
    needs: [scrape, retry]
    if: ${{ always() && !startsWith(github.ref, 'refs/heads/dryrun/') && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python -m pph.run rollup
      - name: Fail only if a store has had no good run for a day
        # One refusal is normal and is retried. A store that stays stale for 26 hours needs a person to look.
        if: always()
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python -m pph.run health --hours 26
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-rollup
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [scrape, retry, rollup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write                # commits the run table to the `status` branch; this job receives no secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: out-*
      - name: Publish status
        run: |
          python -m tools.report artifacts > /tmp/latest.md
          cat /tmp/latest.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "pph-bot"
          git config user.email "pph-bot@users.noreply.github.com"
          if git fetch origin status 2>/dev/null; then git checkout -B status FETCH_HEAD; else git checkout --orphan status && git rm -rfq .; fi
          cp /tmp/latest.md latest.md
          git add latest.md
          git commit -qm "status: ${{ github.event_name }} run ${{ github.run_number }}" || exit 0
          git push origin status
