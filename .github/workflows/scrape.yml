name: Scrape

on:
  schedule:
    - cron: '17 */6 * * *'          # every 6 hours (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and report, but write nothing to the database'
        type: boolean
        default: true
  push:
    branches: ['dryrun/**']          # pushing a dryrun/* branch runs a no-write test

permissions:
  contents: read

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false          # never kill a run that is half-way through writing

env:
  DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run == true) && '--dry-run' || '' }}
  QUICK: ${{ github.event_name == 'push' && '--max-pages 2' || '' }}   # branch tests only sample two pages per category

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.store == 'amazon' && 200 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        store: [elitehubs, vishalperipherals, pcstudio, primeabgb, vedantcomputers, mdcomputers, theitdepot, flipkart, amazon]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - if: matrix.store == 'amazon'
        run: scrapling install
      - name: Scrape ${{ matrix.store }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          echo "| store | status | fetched | written | previous | seconds | note |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          python -m pph.run scrape ${{ matrix.store }} $DRY_RUN $QUICK --time-budget ${{ matrix.store == 'amazon' && 170 || 45 }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-${{ matrix.store }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  rollup:
    needs: scrape
    if: ${{ always() && github.event_name != 'push' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: python -m pph.run rollup
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: out-rollup
          path: out/
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [scrape, rollup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write                # commits the run table to the `status` branch; this job receives no secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: out-*
      - name: Publish status
        run: |
          python -m tools.report artifacts > /tmp/latest.md
          cat /tmp/latest.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "pph-bot"
          git config user.email "pph-bot@users.noreply.github.com"
          if git fetch origin status 2>/dev/null; then git checkout -B status FETCH_HEAD; else git checkout --orphan status && git rm -rfq .; fi
          cp /tmp/latest.md latest.md
          git add latest.md
          git commit -qm "status: ${{ github.event_name }} run ${{ github.run_number }}" || exit 0
          git push origin status
