name: Export sample

# Push a branch named export/<anything> to publish a small sample of product data (public prices only) to that branch
# as sample.json, for the website's tests. The Hostinger server refreshes the sample after every roll-up.
on:
  push:
    branches: ['export/**']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch the sample from the site
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors https://pcparthunt.com/api/export/sample.json.gz | gunzip > sample.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sample
          path: sample.json
          retention-days: 3

  publish:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write               # commits sample.json to the export branch; this job receives no secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sample
      - run: |
          git config user.name "pph-bot"
          git config user.email "pph-bot@users.noreply.github.com"
          git add -f sample.json
          git commit -qm "sample: run ${{ github.run_number }}"
          git push origin HEAD
