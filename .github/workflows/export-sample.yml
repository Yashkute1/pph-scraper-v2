name: Export sample

# Push a branch named export/<anything> to refresh the roll-up and publish a small sample of product data
# (public prices only) to that branch as sample.json, for the website's tests.
on:
  push:
    branches: ['export/**']

permissions:
  contents: read

concurrency:
  group: scrape-live                # same queue as writing scrape runs: the roll-up never overlaps one
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Roll up and export
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python -m pph.run rollup
          python -m tools.export_sample sample.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sample
          path: sample.json
          retention-days: 3

  publish:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write               # commits sample.json to the export branch; this job receives no secrets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sample
      - run: |
          git config user.name "pph-bot"
          git config user.email "pph-bot@users.noreply.github.com"
          git add -f sample.json
          git commit -qm "sample: run ${{ github.run_number }}"
          git push origin HEAD
