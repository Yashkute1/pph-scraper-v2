name: Rebuild products

# Run by hand to rebuild the site's product list from the stored offers now, instead of waiting for the next scrape
# (for example after a change to the category rules). Writes nothing else.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape-live                # never at the same time as a scrape run that writes
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Roll up
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
        run: python -m pph.run rollup
