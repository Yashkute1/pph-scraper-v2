name: Rebuild products

# Run by hand to rebuild the site's product list from the stored offers now, instead of waiting for the next scrape
# (for example after a change to the category rules). Writes nothing else.
on:
  workflow_dispatch:

permissions:
  contents: write                    # pushes the request to the `server-jobs` branch; this workflow receives no database secret

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Roll up on the Hostinger server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh tools/request_server_job.sh rollup
