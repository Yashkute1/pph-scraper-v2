name: Stock check

# Run by hand. Compares the database's in-stock flags with what each store's own pages say. Read-only.
on:
  workflow_dispatch:
    inputs:
      stores:
        description: 'Stores to check (space separated); empty = all'
        default: ''
      urls:
        description: 'Optional: product page URLs to inspect (space separated); needs exactly one store above'
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        store: [elitehubs, vishalperipherals, pcstudio, primeabgb, vedantcomputers, mdcomputers, theitdepot, computech, flipkart, amazon]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - if: matrix.store == 'amazon'
        run: scrapling install
      - name: Check ${{ matrix.store }}
        if: inputs.stores == '' || contains(format(' {0} ', inputs.stores), format(' {0} ', matrix.store))
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
          URLS: ${{ inputs.urls }}
        run: python -m tools.stock_check ${{ matrix.store }} $URLS
