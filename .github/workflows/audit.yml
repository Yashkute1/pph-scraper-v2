name: Audit dump

# Run by hand. Writes every live offer (store, category, price, stock, title) to the `audit` branch as
# offers.tsv, so classification can be checked against the real catalogue. Public product data only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the dump from the site
        # The Hostinger server refreshes these after every roll-up (tools/hostinger_sync.py).
        run: |
          mkdir audit
          for f in offers products; do
            curl -fsS --retry 5 --retry-delay 20 --retry-all-errors "https://pcparthunt.com/api/export/$f.tsv.gz" | gunzip > "audit/$f.tsv"
            wc -l "audit/$f.tsv"
          done
      - name: Publish to the audit branch
        run: |
          git config user.name "pph-bot"
          git config user.email "pph-bot@users.noreply.github.com"
          cp audit/offers.tsv audit/products.tsv /tmp/
          git checkout --orphan audit-tmp && git rm -rfq .
          cp /tmp/offers.tsv /tmp/products.tsv .
          git add offers.tsv products.tsv
          git commit -qm "audit: offers [skip ci]"
          git push -f origin HEAD:audit
