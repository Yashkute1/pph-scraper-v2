name: Audit dump

# Run by hand. Writes every live offer (store, category, price, stock, title) to the `audit` branch as
# offers.tsv, so classification can be checked against the real catalogue. Public product data only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pymysql==1.1.2
      - name: Dump offers
        env:
          MYSQL_URL: ${{ secrets.MYSQL_URL }}
        run: python -m tools.audit_dump
      - name: Publish to the audit branch
        run: |
          git config user.name "pph-bot"
          git config user.email "pph-bot@users.noreply.github.com"
          cp audit/offers.tsv /tmp/offers.tsv
          git checkout --orphan audit-tmp && git rm -rfq .
          cp /tmp/offers.tsv offers.tsv
          git add offers.tsv
          git commit -qm "audit: offers [skip ci]"
          git push -f origin HEAD:audit
